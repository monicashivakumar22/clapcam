<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ClapCam AI — Instant Neural Invisibility Studio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- MediaPipe Selfie Segmentation -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --cyan: #00f0ff;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --green: #10b981;
      --amber: #f59e0b;
      --glass-bg: rgba(8, 12, 26, 0.88);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* ── Fullscreen Media Layers ─────────────────────────────────────── */
    #mediaWrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
      background: #050711;
    }

    video#vid {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1); /* Natural selfie mirror */
      z-index: 1;
      opacity: 1;
    }

    canvas#cv {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }
    canvas#cv.active { opacity: 1; }

    /* Glowing borders */
    #mediaWrap.glow-invisible {
      box-shadow: inset 0 0 120px rgba(236, 72, 153, 0.6), inset 0 0 40px rgba(236, 72, 153, 0.9);
    }
    #mediaWrap.glow-clap {
      box-shadow: inset 0 0 140px rgba(0, 240, 255, 0.8), inset 0 0 50px rgba(0, 240, 255, 1);
    }

    /* Flash Transition */
    #flashLayer {
      position: fixed;
      inset: 0;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease-out;
    }
    #flashLayer.show { opacity: 1; }

    /* ── Top HUD ─────────────────────────────────────────────────────── */
    .hud-top {
      position: fixed;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .brand-pill {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 8px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .brand-name {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .brand-name span {
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .top-telemetry {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Device Selector Dropdown */
    .device-select-wrap {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .device-select-wrap select {
      background: transparent;
      border: none;
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      max-width: 200px;
    }
    .device-select-wrap select option {
      background: #090d1f;
      color: #fff;
    }

    .hud-chip {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 7px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .hud-chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }
    .hud-chip.live {
      border-color: rgba(16, 185, 129, 0.5);
      color: var(--green);
    }
    .hud-chip.live .dot {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: pulse 1.2s infinite;
    }
    .hud-chip.inv {
      background: rgba(236, 72, 153, 0.25);
      border-color: rgba(236, 72, 153, 0.6);
      color: #f472b6;
    }
    .hud-chip.inv .dot {
      background: var(--pink);
      box-shadow: 0 0 12px var(--pink);
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.05);
    }

    /* Equalizer */
    .audio-visualizer-pill {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 6px 12px;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 38px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .eq-stick {
      width: 3px;
      height: 4px;
      border-radius: 2px;
      background: #334155;
      min-height: 4px;
      transition: height 0.05s ease-out, background 0.15s;
    }
    .eq-stick.active { background: var(--purple); }
    .eq-stick.clap { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

    /* ── Bottom Dock ─────────────────────────────────────────────────── */
    .dock-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: auto;
      max-width: 95vw;
    }

    .toast-pill {
      background: rgba(7, 10, 24, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 8px 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #e2e8f0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .toast-pill b { color: var(--cyan); }
    .toast-pill .tag-inv {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: #fff;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 11px;
    }

    .dock-bar {
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    }

    button.dock-btn {
      padding: 13px 24px;
      border-radius: 16px;
      border: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }
    .btn-disappear {
      background: linear-gradient(135deg, #ec4899, #a855f7);
      color: #fff;
      box-shadow: 0 4px 24px rgba(236, 72, 153, 0.45);
    }
    .btn-disappear:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 34px rgba(236, 72, 153, 0.65);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f8fafc;
    }
    .btn-ghost:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }
    .btn-danger-ghost {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    button.dock-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Settings Popover */
    .settings-popover {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 35;
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 20px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 360px;
      max-width: 90vw;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .settings-popover.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 13px;
      font-weight: 600;
    }
    .setting-row input[type=range] {
      flex: 1;
      height: 6px;
      border-radius: 6px;
      accent-color: var(--cyan);
      cursor: pointer;
    }
    .setting-row select {
      background: #0e1328;
      color: var(--cyan);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Media Viewport -->
  <div id="mediaWrap">
    <video id="vid" autoplay playsinline muted></video>
    <canvas id="cv"></canvas>
  </div>

  <!-- Flash Layer -->
  <div id="flashLayer"></div>

  <!-- Top Sci-Fi HUD -->
  <div class="hud-top">
    <div class="brand-pill">
      <div class="brand-icon">👏</div>
      <div class="brand-name">ClapCam <span>AI</span></div>
    </div>

    <div class="top-telemetry">
      <!-- Device Selector Dropdown -->
      <div class="device-select-wrap" id="deviceSelectWrap">
        <span>📹</span>
        <select id="cameraSelect">
          <option value="">Default Camera</option>
        </select>
      </div>

      <div class="hud-chip" id="chipCam"><div class="dot"></div>Camera Live</div>
      <div class="hud-chip" id="chipAi"><div class="dot"></div>AI Neural Mask</div>
      
      <!-- Live Equalizer Visualizer -->
      <div class="audio-visualizer-pill" id="eqPill" title="Clap Frequency Energy">
        <div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div>
        <div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div>
        <div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div>
        <div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div>
      </div>

      <div class="hud-chip" id="chipState"><div class="dot"></div>Visible</div>

      <button class="btn-icon" id="btnFullscreen" title="Toggle Fullscreen">⛶</button>
      <button class="btn-icon" id="btnSettingsToggle" title="Settings">⚙</button>
    </div>
  </div>

  <!-- Settings Popover -->
  <div class="settings-popover" id="settingsPopover">
    <div class="setting-row">
      <span>Clap Sensitivity:</span>
      <input type="range" id="sensRange" min="20" max="150" value="65" />
      <span id="sensText" style="color: var(--cyan); font-family: monospace;">65</span>
    </div>
    <div class="setting-row">
      <span>Stealth Effect Style:</span>
      <select id="modeSelect">
        <option value="stealth">🌌 Cyber Hologram / Stealth Cloak</option>
        <option value="blur">🌫 Live Background Blur</option>
        <option value="cloak">👻 Auto-Inpainted Clean Room</option>
      </select>
    </div>
    <div class="setting-row">
      <span>AI Mask Outline:</span>
      <button class="dock-btn btn-ghost" id="btnDebugMask" style="padding: 6px 12px; font-size: 11px;">Toggle Mask</button>
    </div>
  </div>

  <!-- Bottom Floating Dock -->
  <div class="dock-container">
    <div class="toast-pill" id="toastPill">
      <span><b>Ready!</b> 👏 <b>Clap</b> (or press Space) to vanish instantly!</span>
    </div>

    <div class="dock-bar">
      <button class="dock-btn btn-disappear" id="btnDisappear">👻 Disappear (Clap / Space)</button>
      <button class="dock-btn btn-ghost" id="btnMicToggle">🎙 Arm Mic</button>
      <button class="dock-btn btn-ghost" id="btnLaunch">🛑 Stop Camera</button>
      <button class="dock-btn btn-danger-ghost" id="btnReset">↺ Reset</button>
    </div>
  </div>

<script>
// ── Application State ──────────────────────────────────────────────────────────
const S = {
  cameraActive: false,
  micActive: false,
  aiActive: false,
  invisible: false,
  showDebug: false,
  effectMode: 'stealth', // Instant Cyber Stealth / Hologram (Zero Background Capture needed!)
  threshold: 65,
  cooldownMs: 600,
  lastClap: 0,
  consecutiveFrames: 2,
  consecCount: 0,
  videoDevices: []
};

// ── DOM References ─────────────────────────────────────────────────────────────
const vid          = document.getElementById('vid');
const cv           = document.getElementById('cv');
const ctx          = cv.getContext('2d', { willReadFrequently: true });
const mediaWrap    = document.getElementById('mediaWrap');
const flashLayer   = document.getElementById('flashLayer');
const toastPill    = document.getElementById('toastPill');
const settingsPop  = document.getElementById('settingsPopover');
const cameraSelect = document.getElementById('cameraSelect');

// Buttons & Badges
const chipCam      = document.getElementById('chipCam');
const chipAi       = document.getElementById('chipAi');
const chipState    = document.getElementById('chipState');
const btnLaunch    = document.getElementById('btnLaunch');
const btnDisappear = document.getElementById('btnDisappear');
const btnMicToggle = document.getElementById('btnMicToggle');
const btnReset     = document.getElementById('btnReset');
const btnFullscreen= document.getElementById('btnFullscreen');
const btnSettingsToggle = document.getElementById('btnSettingsToggle');
const btnDebugMask = document.getElementById('btnDebugMask');
const sensRange    = document.getElementById('sensRange');
const sensText     = document.getElementById('sensText');
const modeSelect   = document.getElementById('modeSelect');
const eqSticks     = Array.from(document.querySelectorAll('.eq-stick'));

// ── Offscreen Memory Canvases ──────────────────────────────────────────────────
const autoBgCanvas = document.createElement('canvas');
const autoBgCtx = autoBgCanvas.getContext('2d', { willReadFrequently: true });

const maskCanvas = document.createElement('canvas');
const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });

// ── Sound Synthesizer ──────────────────────────────────────────────────────────
function playChime(freq = 880, dur = 0.12, type = 'sine') {
  try {
    const actx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, actx.currentTime);
    gain.gain.setValueAtTime(0.2, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start();
    osc.stop(actx.currentTime + dur);
  } catch(e) {}
}

// ── 1. Camera Engine ───────────────────────────────────────────────────────────
let cameraStream = null;

async function populateCameraDevices() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    S.videoDevices = devices.filter(d => d.kind === 'videoinput');
    
    cameraSelect.innerHTML = '';
    S.videoDevices.forEach((dev, idx) => {
      const opt = document.createElement('option');
      opt.value = dev.deviceId;
      opt.textContent = dev.label || `Camera ${idx + 1}`;
      cameraSelect.appendChild(opt);
    });
  } catch(e) {}
}

async function startCamera(deviceId = null) {
  try {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
    }

    const constraints = {
      video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'user' },
      audio: false
    };

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch(errConstraint) {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }

    cameraStream = stream;
    vid.srcObject = stream;

    await new Promise((resolve) => {
      if (vid.readyState >= 2) return resolve();
      vid.onloadedmetadata = () => resolve();
      setTimeout(resolve, 800);
    });

    try {
      await vid.play();
    } catch(e) {}

    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
    window.addEventListener('resize', () => {
      cv.width = window.innerWidth;
      cv.height = window.innerHeight;
    });

    S.cameraActive = true;
    vid.style.opacity = '1';

    chipCam.className = 'hud-chip live';
    chipCam.innerHTML = '<div class="dot"></div>Camera Live';

    btnLaunch.innerHTML = '🛑 Stop Camera';
    btnLaunch.className = 'dock-btn btn-ghost';
    btnMicToggle.disabled = false;
    btnDisappear.disabled = false;

    updateToast();
    await populateCameraDevices();
    requestAnimationFrame(renderLoop);

    startMic().catch(() => {});
    return true;
  } catch(err) {
    console.error('Camera startup error:', err);
    return false;
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  S.cameraActive = false;
  vid.style.opacity = '0';
  chipCam.className = 'hud-chip';
  chipCam.innerHTML = '<div class="dot"></div>Camera Off';

  btnLaunch.innerHTML = '📹 Start Camera';
  btnLaunch.className = 'dock-btn btn-cta';
  btnDisappear.disabled = true;
  btnMicToggle.disabled = true;

  updateToast();
}

// ── 2. MediaPipe Neural Segmentation ──────────────────────────────────────────
let selfieSegmentation = null;
let lastMask = null;
let isInferencing = false;

function initMediaPipe() {
  try {
    if (window.SelfieSegmentation) {
      selfieSegmentation = new SelfieSegmentation({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
      });

      selfieSegmentation.setOptions({
        modelSelection: 1, // 1 = Landscape Fast Model
        selfieMode: false
      });

      selfieSegmentation.onResults((results) => {
        lastMask = results.segmentationMask;
        isInferencing = false;
      });

      S.aiActive = true;
      chipAi.className = 'hud-chip live';
      chipAi.innerHTML = '<div class="dot"></div>AI Neural Ready';
    }
  } catch(e) {
    console.warn('MediaPipe notice:', e);
  }
}

// ── 3. Instant Invisibility Render Loop (NO Background Capture Required!) ───────
function renderLoop() {
  if (!S.cameraActive) return;

  const w = cv.width;
  const h = cv.height;

  // Send video frame to MediaPipe AI
  if (selfieSegmentation && !isInferencing && vid.readyState >= 2) {
    isInferencing = true;
    selfieSegmentation.send({ image: vid }).catch(() => { isInferencing = false; });
  }

  // Accumulate automatic clean room background in offscreen buffer
  if (autoBgCanvas.width !== w || autoBgCanvas.height !== h) {
    autoBgCanvas.width = w;
    autoBgCanvas.height = h;
  }
  if (!S.invisible) {
    // Continuously record live background when visible
    drawCover(autoBgCtx, vid, w, h);
  }

  // When invisible mode is ON or debug mask is ON, draw composited output
  if (S.invisible || S.showDebug) {
    cv.classList.add('active');

    if (maskCanvas.width !== w || maskCanvas.height !== h) {
      maskCanvas.width = w;
      maskCanvas.height = h;
    }

    ctx.save();
    ctx.clearRect(0, 0, w, h);

    if (S.invisible) {
      if (S.effectMode === 'stealth') {
        // ── INSTANT CYBER STEALTH HOLOGRAM (Default: No Background Capture Needed!)
        drawCover(ctx, vid, w, h);

        if (lastMask) {
          maskCtx.save();
          maskCtx.clearRect(0, 0, w, h);
          drawCover(maskCtx, lastMask, w, h);
          maskCtx.globalCompositeOperation = 'source-in';

          const grad = maskCtx.createLinearGradient(0, 0, w, h);
          grad.addColorStop(0, 'rgba(0, 240, 255, 0.7)');
          grad.addColorStop(0.5, 'rgba(139, 92, 246, 0.7)');
          grad.addColorStop(1, 'rgba(236, 72, 153, 0.7)');
          maskCtx.fillStyle = grad;
          maskCtx.fillRect(0, 0, w, h);
          maskCtx.restore();

          ctx.drawImage(maskCanvas, 0, 0, w, h);
        }

      } else if (S.effectMode === 'cloak') {
        // ── AUTOMATIC CLEAN ROOM INPAINTER ──────────────────────────────────
        drawCover(ctx, autoBgCanvas, w, h);

        if (lastMask) {
          maskCtx.save();
          maskCtx.clearRect(0, 0, w, h);
          drawCover(maskCtx, lastMask, w, h);
          maskCtx.globalCompositeOperation = 'source-out'; // Live room outside person
          drawCover(maskCtx, vid, w, h);
          maskCtx.restore();

          ctx.drawImage(maskCanvas, 0, 0, w, h);
        }

      } else if (S.effectMode === 'blur') {
        // ── LIVE BACKGROUND BLUR ──────────────────────────────────────────
        drawCover(ctx, vid, w, h);

        if (lastMask) {
          maskCtx.save();
          maskCtx.clearRect(0, 0, w, h);
          drawCover(maskCtx, lastMask, w, h);
          maskCtx.globalCompositeOperation = 'source-out';
          maskCtx.filter = 'blur(20px)';
          drawCover(maskCtx, vid, w, h);
          maskCtx.restore();

          ctx.drawImage(maskCanvas, 0, 0, w, h);
        }
      }
    } else {
      drawCover(ctx, vid, w, h);
    }

    // Mask Debug Outline
    if (S.showDebug && lastMask) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      drawCover(ctx, lastMask, w, h);
      ctx.restore();
    }

    ctx.restore();
  } else {
    cv.classList.remove('active');
  }

  requestAnimationFrame(renderLoop);
}

// Utility: Aspect Ratio Cover Scaling
function drawCover(targetCtx, src, targetW, targetH) {
  try {
    const srcW = src.videoWidth || src.width || targetW;
    const srcH = src.videoHeight || src.height || targetH;
    if (!srcW || !srcH) return;

    const srcRatio = srcW / srcH;
    const targetRatio = targetW / targetH;

    let dw, dh, dx, dy;
    if (targetRatio > srcRatio) {
      dw = targetW;
      dh = targetW / srcRatio;
      dx = 0;
      dy = (targetH - dh) / 2;
    } else {
      dh = targetH;
      dw = targetH * srcRatio;
      dx = (targetW - dw) / 2;
      dy = 0;
    }
    targetCtx.drawImage(src, dx, dy, dw, dh);
  } catch(e) {}
}

// ── 4. Instant Invisibility Toggle (No Capture Countdown Needed!) ──────────────
function toggleInvisibility() {
  S.invisible = !S.invisible;

  if (S.invisible) {
    mediaWrap.className = 'glow-invisible';
    chipState.className = 'hud-chip inv';
    chipState.innerHTML = '<div class="dot"></div>👻 INVISIBLE';
    btnDisappear.innerHTML = '👁 Reappear';
    triggerFlash('rgba(236, 72, 153, 0.5)');
    playChime(1080, 0.22, 'sine');
  } else {
    mediaWrap.className = '';
    chipState.className = 'hud-chip live';
    chipState.innerHTML = '<div class="dot"></div>Visible';
    btnDisappear.innerHTML = '👻 Disappear (Clap / Space)';
    triggerFlash('rgba(0, 240, 255, 0.4)');
    playChime(760, 0.22, 'sine');
  }

  updateToast();
}

// ── 5. Audio Engine & Clap Detection ──────────────────────────────────────────
let audioCtx = null;
let audioAnalyser = null;
let micStream = null;
let freqBuffer = null;
let audioRaf = null;

async function startMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    audioAnalyser = audioCtx.createAnalyser();
    audioAnalyser.fftSize = 1024;
    audioAnalyser.smoothingTimeConstant = 0.2;

    const source = audioCtx.createMediaStreamSource(micStream);
    source.connect(audioAnalyser);

    freqBuffer = new Uint8Array(audioAnalyser.frequencyBinCount);
    S.micActive = true;

    btnMicToggle.innerHTML = '🔇 Disarm Mic';
    btnMicToggle.className = 'dock-btn btn-ghost';
    updateToast();
    audioLoop();
    return true;
  } catch(err) {
    console.warn('Mic notice:', err);
    return false;
  }
}

function stopMic() {
  if (audioRaf) cancelAnimationFrame(audioRaf);
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  if (audioCtx) {
    audioCtx.close();
    audioCtx = null;
  }
  S.micActive = false;
  btnMicToggle.innerHTML = '🎙 Arm Mic';
  eqSticks.forEach(s => { s.style.height = '4px'; s.className = 'eq-stick'; });
  updateToast();
}

function audioLoop() {
  if (!S.micActive || !audioAnalyser) return;
  audioAnalyser.getByteFrequencyData(freqBuffer);

  const sampleRate = audioCtx.sampleRate;
  const binCount   = audioAnalyser.frequencyBinCount;
  const binWidth   = sampleRate / (binCount * 2);
  const loBin      = Math.floor(2000 / binWidth);
  const hiBin      = Math.min(Math.ceil(4000 / binWidth), binCount - 1);

  let bandSum = 0, bandCount = 0;
  for (let i = loBin; i <= hiBin; i++) {
    bandSum += freqBuffer[i];
    bandCount++;
  }
  const energy = bandCount > 0 ? bandSum / bandCount : 0;

  // Equalizer visualizer
  const step = Math.floor(binCount / eqSticks.length);
  const isSpike = energy > S.threshold;
  for (let i = 0; i < eqSticks.length; i++) {
    const raw = freqBuffer[i * step] || 0;
    const h = Math.max(4, (raw / 255) * 26);
    eqSticks[i].style.height = `${h}px`;
    eqSticks[i].className = 'eq-stick' + (isSpike ? ' clap' : ' active');
  }

  // Trigger Gate
  const now = Date.now();
  if (energy > S.threshold) {
    S.consecCount++;
    if (S.consecCount >= S.consecutiveFrames && now - S.lastClap > S.cooldownMs) {
      S.consecCount = 0;
      onClapTrigger();
    }
  } else {
    S.consecCount = 0;
  }

  audioRaf = requestAnimationFrame(audioLoop);
}

function onClapTrigger() {
  S.lastClap = Date.now();
  triggerFlash('rgba(0, 240, 255, 0.55)');
  mediaWrap.classList.add('glow-clap');
  setTimeout(() => mediaWrap.classList.remove('glow-clap'), 300);

  toggleInvisibility();
}

// ── UI Helpers ─────────────────────────────────────────────────────────────────
function triggerFlash(colorRgba) {
  flashLayer.style.background = colorRgba;
  flashLayer.classList.add('show');
  setTimeout(() => flashLayer.classList.remove('show'), 160);
}

function updateToast() {
  if (!S.cameraActive) {
    toastPill.innerHTML = '<span><b>Camera Off</b> — Click Start Camera</span>';
  } else if (!S.micActive) {
    toastPill.innerHTML = '<span><b>Step 2:</b> Click <b>"Arm Mic"</b> (or press Space)</span>';
  } else if (!S.invisible) {
    toastPill.innerHTML = '<span><b>Ready!</b> 👏 <b>Clap</b> (or press Space) to vanish instantly!</span>';
  } else {
    toastPill.innerHTML = '<span class="tag-inv">INVISIBLE</span> <span>AI Stealth Active — 👏 <b>Clap</b> to reappear</span>';
  }
}

function resetStudio() {
  stopMic();
  S.invisible = false;
  mediaWrap.className = '';
  cv.classList.remove('active');
  chipState.className = 'hud-chip';
  chipState.innerHTML = '<div class="dot"></div>Visible';
  btnDisappear.innerHTML = '👻 Disappear (Clap / Space)';
  updateToast();
}

// ── Event Handlers ─────────────────────────────────────────────────────────────
btnLaunch.addEventListener('click', () => {
  if (S.cameraActive) stopCamera();
  else startCamera(cameraSelect.value || null);
});

cameraSelect.addEventListener('change', () => {
  startCamera(cameraSelect.value || null);
});

btnMicToggle.addEventListener('click', () => S.micActive ? stopMic() : startMic());
btnDisappear.addEventListener('click', toggleInvisibility);
btnReset.addEventListener('click', resetStudio);

btnSettingsToggle.addEventListener('click', () => {
  settingsPop.classList.toggle('open');
});

btnDebugMask.addEventListener('click', () => {
  S.showDebug = !S.showDebug;
  btnDebugMask.style.color = S.showDebug ? 'var(--cyan)' : '';
});

btnFullscreen.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

sensRange.addEventListener('input', (e) => {
  S.threshold = parseInt(e.target.value, 10);
  sensText.textContent = S.threshold;
});

modeSelect.addEventListener('change', (e) => {
  S.effectMode = e.target.value;
  updateToast();
});

// Spacebar Hotkey to Trigger Invisibility
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
    e.preventDefault();
    if (S.cameraActive) onClapTrigger();
  }
});

// Auto-initialize on page load
window.addEventListener('load', () => {
  initMediaPipe();
  updateToast();
  startCamera().catch(() => {});
});
</script>
