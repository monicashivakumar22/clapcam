<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ClapCam AI — Fullscreen Neural Studio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- MediaPipe Selfie Segmentation -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --cyan: #00f0ff;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --green: #10b981;
      --amber: #f59e0b;
      --glass-bg: rgba(8, 12, 26, 0.88);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* ── Fullscreen Media Layers ─────────────────────────────────────── */
    #mediaWrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
      background: #050711;
    }

    video#vid {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
      opacity: 1;
    }

    canvas#cv {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s;
    }
    canvas#cv.active { opacity: 1; }

    /* Glowing borders */
    #mediaWrap.glow-invisible {
      box-shadow: inset 0 0 120px rgba(0, 240, 255, 0.6), inset 0 0 40px rgba(0, 240, 255, 0.9);
    }
    #mediaWrap.glow-clap {
      box-shadow: inset 0 0 140px rgba(0, 240, 255, 0.8), inset 0 0 50px rgba(0, 240, 255, 1);
    }

    /* Flash Transition */
    #flashLayer {
      position: fixed;
      inset: 0;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease-out;
    }
    #flashLayer.show { opacity: 1; }

    /* ── Top HUD ─────────────────────────────────────────────────────── */
    .hud-top {
      position: fixed;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .brand-pill {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 8px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .brand-name {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .brand-name span {
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .top-telemetry {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Device Selector Dropdown */
    .device-select-wrap {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .device-select-wrap select {
      background: transparent;
      border: none;
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      max-width: 180px;
    }
    .device-select-wrap select option {
      background: #090d1f;
      color: #fff;
    }

    .hud-chip {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 7px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .hud-chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }
    .hud-chip.live {
      border-color: rgba(16, 185, 129, 0.5);
      color: var(--green);
    }
    .hud-chip.live .dot {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: pulse 1.2s infinite;
    }
    .hud-chip.inv {
      background: rgba(0, 240, 255, 0.2);
      border-color: rgba(0, 240, 255, 0.7);
      color: var(--cyan);
    }
    .hud-chip.inv .dot {
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.05);
    }

    /* Equalizer */
    .audio-visualizer-pill {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 6px 12px;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 38px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .eq-stick {
      width: 3px;
      height: 4px;
      border-radius: 2px;
      background: #334155;
      min-height: 4px;
      transition: height 0.05s ease-out, background 0.15s;
    }
    .eq-stick.active { background: var(--green); }
    .eq-stick.clap { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

    /* ── Bottom Dock ─────────────────────────────────────────────────── */
    .dock-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: auto;
      max-width: 95vw;
    }

    .toast-pill {
      background: rgba(7, 10, 24, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 8px 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #e2e8f0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .toast-pill b { color: var(--cyan); }
    .toast-pill .tag-inv {
      background: linear-gradient(135deg, #00f0ff, #8b5cf6);
      color: #050711;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 11px;
    }

    .dock-bar {
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    }

    button.dock-btn {
      padding: 13px 22px;
      border-radius: 16px;
      border: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }
    .btn-disappear {
      background: linear-gradient(135deg, #00f0ff, #8b5cf6);
      color: #050711;
      box-shadow: 0 4px 24px rgba(0, 240, 255, 0.45);
    }
    .btn-disappear:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 34px rgba(0, 240, 255, 0.65);
    }
    .btn-mic-active {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--green);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f8fafc;
    }
    .btn-ghost:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }
    .btn-danger-ghost {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    button.dock-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Settings Popover */
    .settings-popover {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 35;
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 20px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 380px;
      max-width: 90vw;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .settings-popover.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 13px;
      font-weight: 600;
    }
    .setting-row input[type=range] {
      flex: 1;
      height: 6px;
      border-radius: 6px;
      accent-color: var(--cyan);
      cursor: pointer;
    }
    .setting-row select {
      background: #0e1328;
      color: var(--cyan);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Media Viewport -->
  <div id="mediaWrap">
    <video id="vid" autoplay playsinline muted></video>
    <canvas id="cv"></canvas>
  </div>

  <!-- Flash Layer -->
  <div id="flashLayer"></div>

  <!-- Top Sci-Fi HUD -->
  <div class="hud-top">
    <div class="brand-pill">
      <div class="brand-icon">👏</div>
      <div class="brand-name">ClapCam <span>AI</span></div>
    </div>

    <div class="top-telemetry">
      <!-- Device Selector Dropdown -->
      <div class="device-select-wrap" id="deviceSelectWrap">
        <span>📹</span>
        <select id="cameraSelect">
          <option value="">Default Camera</option>
        </select>
      </div>

      <div class="hud-chip" id="chipCam"><div class="dot"></div>Camera Off</div>
      <div class="hud-chip" id="chipMic"><div class="dot"></div>Mic Off</div>
      <div class="hud-chip" id="chipAi"><div class="dot"></div>AI Neural Ready</div>
      
      <!-- Live Equalizer Visualizer -->
      <div class="audio-visualizer-pill" id="eqPill" title="Live Microphone Visualizer">
        <div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div>
        <div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div>
        <div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div>
        <div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div><div class="eq-stick"></div>
      </div>

      <div class="hud-chip" id="chipState"><div class="dot"></div>Visible</div>

      <button class="btn-icon" id="btnFullscreen" title="Toggle Fullscreen">⛶</button>
      <button class="btn-icon" id="btnSettingsToggle" title="Settings">⚙</button>
    </div>
  </div>

  <!-- Settings Popover -->
  <div class="settings-popover" id="settingsPopover">
    <div class="setting-row">
      <span>Clap Sensitivity:</span>
      <input type="range" id="sensRange" min="20" max="150" value="65" />
      <span id="sensText" style="color: var(--cyan); font-family: monospace;">65</span>
    </div>
    <div class="setting-row">
      <span>Invisibility Style:</span>
      <select id="modeSelect">
        <option value="cloak">🔮 Optical Invisibility Cloak</option>
        <option value="stealth">🌌 Cyber Hologram Cloak</option>
        <option value="blur">🌫 Live Background Blur</option>
      </select>
    </div>
    <div class="setting-row">
      <span>AI Mask Outline:</span>
      <button class="dock-btn btn-ghost" id="btnDebugMask" style="padding: 6px 12px; font-size: 11px;">Toggle Mask</button>
    </div>
  </div>

  <!-- Bottom Floating Dock -->
  <div class="dock-container">
    <div class="toast-pill" id="toastPill">
      <span><b>Ready!</b> 👏 <b>Clap</b> (or press Space) to vanish!</span>
    </div>

    <div class="dock-bar">
      <button class="dock-btn btn-disappear" id="btnDisappear">👻 Disappear (Clap / Space)</button>
      <button class="dock-btn btn-ghost" id="btnMicToggle">🎙 Arm Mic</button>
      <button class="dock-btn btn-ghost" id="btnLaunch">🛑 Stop Camera</button>
      <button class="dock-btn btn-danger-ghost" id="btnReset">↺ Reset</button>
    </div>
  </div>

<script>
// ── Application State ──────────────────────────────────────────────────────────
const S = {
  cameraActive: false,
  micActive: false,
  aiActive: false,
  invisible: false,
  showDebug: false,
  effectMode: 'cloak', // OPTICAL INVISIBILITY CLOAK ON SILHOUETTE
  threshold: 65,
  cooldownMs: 800,
  lastClap: 0,
  consecutiveFrames: 1,
  consecCount: 0,
  videoDevices: []
};

// ── DOM References ─────────────────────────────────────────────────────────────
const vid          = document.getElementById('vid');
const cv           = document.getElementById('cv');
const ctx          = cv.getContext('2d', { willReadFrequently: true });
const mediaWrap    = document.getElementById('mediaWrap');
const flashLayer   = document.getElementById('flashLayer');
const toastPill    = document.getElementById('toastPill');
const settingsPop  = document.getElementById('settingsPopover');
const cameraSelect = document.getElementById('cameraSelect');

// Badges & Buttons
const chipCam      = document.getElementById('chipCam');
const chipMic      = document.getElementById('chipMic');
const chipAi       = document.getElementById('chipAi');
const chipState    = document.getElementById('chipState');
const btnLaunch    = document.getElementById('btnLaunch');
const btnDisappear = document.getElementById('btnDisappear');
const btnMicToggle = document.getElementById('btnMicToggle');
const btnReset     = document.getElementById('btnReset');
const btnFullscreen= document.getElementById('btnFullscreen');
const btnSettingsToggle = document.getElementById('btnSettingsToggle');
const btnDebugMask = document.getElementById('btnDebugMask');
const sensRange    = document.getElementById('sensRange');
const sensText     = document.getElementById('sensText');
const modeSelect   = document.getElementById('modeSelect');
const eqSticks     = Array.from(document.querySelectorAll('.eq-stick'));

// ── Offscreen Processing Buffers ───────────────────────────────────────────────
// Person Alpha Mask
const maskCanvas = document.createElement('canvas');
const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });

// Cloak Texture Buffer
const cloakCanvas = document.createElement('canvas');
const cloakCtx = cloakCanvas.getContext('2d', { willReadFrequently: true });

// ── Audio Synthesizer ──────────────────────────────────────────────────────────
function playChime(freq = 880, dur = 0.12, type = 'sine') {
  try {
    const actx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, actx.currentTime);
    gain.gain.setValueAtTime(0.2, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start();
    osc.stop(actx.currentTime + dur);
  } catch(e) {}
}

// ── 1. Camera Engine ───────────────────────────────────────────────────────────
let cameraStream = null;

async function populateCameraDevices() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    S.videoDevices = devices.filter(d => d.kind === 'videoinput');
    
    cameraSelect.innerHTML = '';
    S.videoDevices.forEach((dev, idx) => {
      const opt = document.createElement('option');
      opt.value = dev.deviceId;
      opt.textContent = dev.label || `Camera ${idx + 1}`;
      cameraSelect.appendChild(opt);
    });
  } catch(e) {}
}

async function startCamera(deviceId = null) {
  hidePermissionOverlay();

  try {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
    }

    try {
      const permStatus = await navigator.permissions.query({ name: 'camera' });
      if (permStatus.state === 'denied') {
        showPermissionOverlay('camera');
        return false;
      }
    } catch(e) {}

    const constraints = {
      video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    };

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch(errConstraint) {
      if (errConstraint.name === 'NotAllowedError' || errConstraint.name === 'PermissionDeniedError') {
        throw errConstraint;
      }
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }

    cameraStream = stream;
    vid.srcObject = stream;

    await new Promise((resolve) => {
      if (vid.readyState >= 2) return resolve();
      vid.onloadedmetadata = () => resolve();
      setTimeout(resolve, 800);
    });

    try {
      await vid.play();
    } catch(e) {}

    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
    window.addEventListener('resize', () => {
      cv.width = window.innerWidth;
      cv.height = window.innerHeight;
    });

    S.cameraActive = true;
    vid.style.opacity = '1';

    chipCam.className = 'hud-chip live';
    chipCam.innerHTML = '<div class="dot"></div>Camera Live';

    btnLaunch.innerHTML = '🛑 Stop Camera';
    btnLaunch.className = 'dock-btn btn-ghost';
    btnMicToggle.disabled = false;
    btnDisappear.disabled = false;

    updateToast();
    await populateCameraDevices();
    requestAnimationFrame(renderLoop);

    return true;
  } catch(err) {
    console.error('Camera startup error:', err);
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      showPermissionOverlay('camera');
    } else {
      toastPill.innerHTML = `<span><b style="color:#f87171">Camera Error:</b> ${err.message || 'Not available'} — <a href="#" onclick="startCamera();return false" style="color:var(--cyan);text-decoration:underline;">Retry</a></span>`;
    }
    return false;
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  S.cameraActive = false;
  vid.style.opacity = '0';
  chipCam.className = 'hud-chip';
  chipCam.innerHTML = '<div class="dot"></div>Camera Off';

  btnLaunch.innerHTML = '📹 Start Camera';
  btnLaunch.className = 'dock-btn btn-disappear';
  btnDisappear.disabled = true;
  btnMicToggle.disabled = true;

  updateToast();
}

// ── Permission Denied Overlay ──────────────────────────────────────────────────
function showPermissionOverlay(type = 'camera') {
  hidePermissionOverlay();
  const isMic = type === 'mic';
  const overlay = document.createElement('div');
  overlay.id = 'permOverlay';
  overlay.style.cssText = `
    position:fixed; inset:0; z-index:100;
    background: rgba(5,7,17,0.95);
    display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(20px);
  `;
  overlay.innerHTML = `
    <div style="
      background: rgba(15,20,40,0.95);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      padding: 40px 48px;
      max-width: 520px;
      width: 90vw;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    ">
      <div style="font-size:56px; margin-bottom:16px;">${isMic ? '🎙️' : '🔒'}</div>
      <h2 style="
        font-family:'Outfit',sans-serif;
        font-size:24px;
        font-weight:800;
        margin-bottom:8px;
        background: linear-gradient(90deg,#f87171,#ec4899);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
      ">${isMic ? 'Microphone Permission Needed' : 'Camera Permission Denied'}</h2>
      <p style="color:#94a3b8; font-size:14px; line-height:1.7; margin-bottom:24px;">
        ${isMic ? 'ClapCam needs microphone access to detect your claps in real time:' : 'Your browser blocked camera access. Follow these steps to fix it:'}
      </p>
      <div style="
        text-align:left;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 20px 24px;
        margin-bottom: 24px;
      ">
        <div style="color:#e2e8f0; font-size:14px; line-height:2;">
          <b style="color:#00f0ff;">Step 1:</b> Click the <b>🔒 lock icon</b> on the left of the URL bar<br>
          <b style="color:#00f0ff;">Step 2:</b> Set <b>"${isMic ? 'Microphone' : 'Camera'}"</b> to <b>"Allow"</b><br>
          <b style="color:#00f0ff;">Step 3:</b> Click <b>"Retry"</b> below
        </div>
      </div>
      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <button onclick="hidePermissionOverlay(); ${isMic ? 'startMic();' : 'startCamera();'}" style="
          padding: 14px 32px;
          border-radius: 16px;
          border: none;
          background: linear-gradient(135deg, #00f0ff, #8b5cf6);
          color: #fff;
          font-family: 'Plus Jakarta Sans', sans-serif;
          font-size: 15px;
          font-weight: 700;
          cursor: pointer;
          box-shadow: 0 4px 24px rgba(0,240,255,0.4);
        ">
          🔄 Retry ${isMic ? 'Mic' : 'Camera'}
        </button>
        <button onclick="hidePermissionOverlay();" style="
          padding: 14px 24px;
          border-radius: 16px;
          border: 1px solid rgba(255,255,255,0.15);
          background: rgba(255,255,255,0.08);
          color: #f8fafc;
          font-family: 'Plus Jakarta Sans', sans-serif;
          font-size: 14px;
          font-weight: 600;
          cursor: pointer;
        ">
          Dismiss
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function hidePermissionOverlay() {
  const old = document.getElementById('permOverlay');
  if (old) old.remove();
}

// ── 2. MediaPipe Neural Segmentation ──────────────────────────────────────────
let selfieSegmentation = null;
let lastMask = null;
let isInferencing = false;

function initMediaPipe() {
  try {
    if (window.SelfieSegmentation) {
      selfieSegmentation = new SelfieSegmentation({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
      });

      selfieSegmentation.setOptions({
        modelSelection: 1, // 1 = Landscape Fast Model
        selfieMode: false
      });

      selfieSegmentation.onResults((results) => {
        lastMask = results.segmentationMask;
        isInferencing = false;
      });

      S.aiActive = true;
      chipAi.className = 'hud-chip live';
      chipAi.innerHTML = '<div class="dot"></div>AI Neural Ready';
    }
  } catch(e) {
    console.warn('MediaPipe notice:', e);
  }
}

// ── 3. REAL-TIME OPTICAL INVISIBILITY PIPELINE ─────────────────────────────────
function renderLoop() {
  if (!S.cameraActive) return;

  const w = cv.width;
  const h = cv.height;

  // Send video frame to MediaPipe AI
  if (selfieSegmentation && !isInferencing && vid.readyState >= 2) {
    isInferencing = true;
    selfieSegmentation.send({ image: vid }).catch(() => { isInferencing = false; });
  }

  // Ensure buffers match viewport resolution
  if (maskCanvas.width !== w || maskCanvas.height !== h) {
    maskCanvas.width = w;
    maskCanvas.height = h;
  }
  if (cloakCanvas.width !== w || cloakCanvas.height !== h) {
    cloakCanvas.width = w;
    cloakCanvas.height = h;
  }

  // ── STEP 1: CONVERT MEDIAPIPE MASK TO TRUE 32-BIT ALPHA CUTOUT ──────────────
  let hasValidMask = false;
  if (lastMask && vid.readyState >= 2) {
    hasValidMask = true;
    drawCover(maskCtx, lastMask, w, h);

    const imgData = maskCtx.getImageData(0, 0, w, h);
    const data32 = new Uint32Array(imgData.data.buffer);
    const len = data32.length;

    for (let i = 0; i < len; i++) {
      const r = data32[i] & 0xFF; // Luminance
      if (r > 40) {
        // Person region: Solid/Feathered Alpha
        const a = r > 160 ? 255 : Math.floor(((r - 40) / 120) * 255);
        data32[i] = (a << 24) | 0x00FFFFFF;
      } else {
        // Background region: Transparent
        data32[i] = 0x00000000;
      }
    }
    maskCtx.putImageData(imgData, 0, 0);
  }

  // ── STEP 2: RENDER LIVE VIDEO + CONFINED INVISIBLE CLOAK ON SILHOUETTE ───────
  if (S.invisible || S.showDebug) {
    cv.classList.add('active');
    vid.style.opacity = '0'; // Video rendered on canvas

    ctx.save();
    ctx.clearRect(0, 0, w, h);

    // 1. ALWAYS render the LIVE 100% crisp webcam video everywhere as the base
    drawCover(ctx, vid, w, h);

    if (S.invisible && hasValidMask) {
      if (S.effectMode === 'cloak') {
        // ── 🔮 OPTICAL INVISIBILITY CLOAK (ONLY ON PERSON/FACE SILHOUETTE) ─────
        // 1. Prepare refracted background texture
        cloakCtx.save();
        cloakCtx.clearRect(0, 0, w, h);
        cloakCtx.filter = 'blur(10px) brightness(1.08) contrast(1.05)';
        drawCover(cloakCtx, vid, w, h);
        cloakCtx.restore();

        // 2. Clip strictly inside person mask (so surrounding room is untouched)
        cloakCtx.save();
        cloakCtx.globalCompositeOperation = 'destination-in';
        cloakCtx.drawImage(maskCanvas, 0, 0, w, h);
        cloakCtx.restore();

        // 3. Draw cloaking texture ONLY over the person's silhouette
        ctx.drawImage(cloakCanvas, 0, 0, w, h);

        // 4. Subtle optical boundary highlight
        ctx.save();
        ctx.shadowColor = 'rgba(0, 240, 255, 0.6)';
        ctx.shadowBlur = 12;
        ctx.globalAlpha = 0.25;
        ctx.drawImage(maskCanvas, 0, 0, w, h);
        ctx.restore();

      } else if (S.effectMode === 'stealth') {
        // ── 🌌 CYBER HOLOGRAM CLOAK ───────────────────────────────────────────
        maskCtx.save();
        maskCtx.globalCompositeOperation = 'source-in';
        const grad = maskCtx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, 'rgba(0, 240, 255, 0.75)');
        grad.addColorStop(0.5, 'rgba(139, 92, 246, 0.75)');
        grad.addColorStop(1, 'rgba(236, 72, 153, 0.75)');
        maskCtx.fillStyle = grad;
        maskCtx.fillRect(0, 0, w, h);
        maskCtx.restore();

        ctx.drawImage(maskCanvas, 0, 0, w, h);

      } else if (S.effectMode === 'blur') {
        // ── 🌫 LIVE BACKGROUND BLUR ───────────────────────────────────────────
        ctx.save();
        ctx.filter = 'blur(18px)';
        drawCover(ctx, vid, w, h);
        ctx.restore();

        if (hasValidMask) {
          maskCtx.save();
          maskCtx.globalCompositeOperation = 'source-in';
          drawCover(maskCtx, vid, w, h);
          maskCtx.restore();
          ctx.drawImage(maskCanvas, 0, 0, w, h);
        }
      }
    }

    // Mask Debug Outline
    if (S.showDebug && hasValidMask) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.drawImage(maskCanvas, 0, 0, w, h);
      ctx.restore();
    }

    ctx.restore();
  } else {
    cv.classList.remove('active');
    vid.style.opacity = '1';
  }

  requestAnimationFrame(renderLoop);
}

// Utility: Aspect Ratio Cover Scaling
function drawCover(targetCtx, src, targetW, targetH) {
  try {
    const srcW = src.videoWidth || src.width || targetW;
    const srcH = src.videoHeight || src.height || targetH;
    if (!srcW || !srcH) return;

    const srcRatio = srcW / srcH;
    const targetRatio = targetW / targetH;

    let dw, dh, dx, dy;
    if (targetRatio > srcRatio) {
      dw = targetW;
      dh = targetW / srcRatio;
      dx = 0;
      dy = (targetH - dh) / 2;
    } else {
      dh = targetH;
      dw = targetH * srcRatio;
      dx = (targetW - dw) / 2;
      dy = 0;
    }
    targetCtx.drawImage(src, dx, dy, dw, dh);
  } catch(e) {}
}

// ── 4. Instant Invisibility Toggle ────────────────────────────────────────────
function toggleInvisibility() {
  S.invisible = !S.invisible;

  if (S.invisible) {
    mediaWrap.className = 'glow-invisible';
    chipState.className = 'hud-chip inv';
    chipState.innerHTML = '<div class="dot"></div>🔮 INVISIBLE';
    btnDisappear.innerHTML = '👁 Reappear';
    triggerFlash('rgba(0, 240, 255, 0.6)');
    playChime(1120, 0.22, 'sine');
  } else {
    mediaWrap.className = '';
    chipState.className = 'hud-chip live';
    chipState.innerHTML = '<div class="dot"></div>Visible';
    btnDisappear.innerHTML = '👻 Disappear (Clap / Space)';
    triggerFlash('rgba(0, 240, 255, 0.4)');
    playChime(760, 0.22, 'sine');
  }

  updateToast();
}

// ── 5. Audio Engine & Clap Detection ──────────────────────────────────────────
let audioCtx = null;
let audioAnalyser = null;
let micStream = null;
let freqBuffer = null;
let timeBuffer = null;
let audioRaf = null;

async function startMic() {
  hidePermissionOverlay();
  try {
    if (!audioCtx || audioCtx.state === 'closed') {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });
    } catch(errRaw) {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }

    micStream = stream;
    audioAnalyser = audioCtx.createAnalyser();
    audioAnalyser.fftSize = 512;
    audioAnalyser.smoothingTimeConstant = 0.15;

    const source = audioCtx.createMediaStreamSource(micStream);
    source.connect(audioAnalyser);

    freqBuffer = new Uint8Array(audioAnalyser.frequencyBinCount);
    timeBuffer = new Uint8Array(audioAnalyser.fftSize);
    S.micActive = true;

    btnMicToggle.innerHTML = '🔇 Disarm Mic';
    btnMicToggle.className = 'dock-btn btn-mic-active';
    chipMic.className = 'hud-chip live';
    chipMic.innerHTML = '<div class="dot"></div>Mic Live';

    updateToast();
    playChime(980, 0.08, 'sine');
    audioLoop();
    return true;
  } catch(err) {
    console.error('Microphone startup error:', err);
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      showPermissionOverlay('mic');
    } else {
      toastPill.innerHTML = `<span><b style="color:#f87171">Mic Error:</b> ${err.message || 'Not available'} — <a href="#" onclick="startMic();return false" style="color:var(--cyan);text-decoration:underline;">Retry</a></span>`;
    }
    return false;
  }
}

function stopMic() {
  if (audioRaf) {
    cancelAnimationFrame(audioRaf);
    audioRaf = null;
  }
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  if (audioCtx && audioCtx.state !== 'closed') {
    audioCtx.close().catch(() => {});
    audioCtx = null;
  }
  S.micActive = false;
  btnMicToggle.innerHTML = '🎙 Arm Mic';
  btnMicToggle.className = 'dock-btn btn-ghost';
  chipMic.className = 'hud-chip';
  chipMic.innerHTML = '<div class="dot"></div>Mic Off';
  eqSticks.forEach(s => { s.style.height = '4px'; s.className = 'eq-stick'; });
  updateToast();
}

let rollingEnergy = 0;

function audioLoop() {
  if (!S.micActive || !audioAnalyser) return;
  audioAnalyser.getByteFrequencyData(freqBuffer);
  audioAnalyser.getByteTimeDomainData(timeBuffer);

  const binCount = audioAnalyser.frequencyBinCount;
  const loBin = Math.floor(binCount * 0.15);
  const hiBin = Math.floor(binCount * 0.55);

  let bandSum = 0;
  for (let i = loBin; i <= hiBin; i++) {
    bandSum += freqBuffer[i];
  }
  const energy = bandSum / (hiBin - loBin + 1);

  let maxAmp = 0;
  for (let i = 0; i < timeBuffer.length; i++) {
    const v = Math.abs(timeBuffer[i] - 128);
    if (v > maxAmp) maxAmp = v;
  }

  rollingEnergy = rollingEnergy * 0.85 + energy * 0.15;
  const isClapSpike = (energy > S.threshold || maxAmp > 90) && (energy > rollingEnergy * 1.6 + 15);

  const step = Math.floor(binCount / eqSticks.length);
  for (let i = 0; i < eqSticks.length; i++) {
    const raw = freqBuffer[i * step] || 0;
    const h = Math.max(4, (raw / 255) * 28);
    eqSticks[i].style.height = `${h}px`;
    eqSticks[i].className = 'eq-stick' + (isClapSpike ? ' clap' : (h > 6 ? ' active' : ''));
  }

  const now = Date.now();
  if (isClapSpike) {
    if (now - S.lastClap > S.cooldownMs) {
      S.lastClap = now;
      onClapTrigger();
    }
  }

  audioRaf = requestAnimationFrame(audioLoop);
}

function onClapTrigger() {
  triggerFlash('rgba(0, 240, 255, 0.65)');
  mediaWrap.classList.add('glow-clap');
  setTimeout(() => mediaWrap.classList.remove('glow-clap'), 300);

  toggleInvisibility();
}

// ── UI Helpers ─────────────────────────────────────────────────────────────────
function triggerFlash(colorRgba) {
  flashLayer.style.background = colorRgba;
  flashLayer.classList.add('show');
  setTimeout(() => flashLayer.classList.remove('show'), 160);
}

function updateToast() {
  if (!S.cameraActive) {
    toastPill.innerHTML = '<span><b>Camera Off</b> — Click Start Camera</span>';
  } else if (!S.micActive) {
    toastPill.innerHTML = '<span><b>Tip:</b> Click <b>"🎙 Arm Mic"</b> to enable clapping (or use Spacebar)</span>';
  } else if (!S.invisible) {
    toastPill.innerHTML = '<span><b>Ready!</b> 👏 <b>Clap</b> (or press Space) for Invisibility Cloak!</span>';
  } else {
    toastPill.innerHTML = '<span class="tag-inv">CLOAK ACTIVE</span> <span>Invisibility Cloak Active — 👏 <b>Clap</b> to reappear</span>';
  }
}

function resetStudio() {
  stopMic();
  S.invisible = false;
  mediaWrap.className = '';
  cv.classList.remove('active');
  chipState.className = 'hud-chip';
  chipState.innerHTML = '<div class="dot"></div>Visible';
  btnDisappear.innerHTML = '👻 Disappear (Clap / Space)';
  updateToast();
}

// ── Event Handlers ─────────────────────────────────────────────────────────────
btnLaunch.addEventListener('click', () => {
  if (S.cameraActive) stopCamera();
  else startCamera(cameraSelect.value || null);
});

cameraSelect.addEventListener('change', () => {
  startCamera(cameraSelect.value || null);
});

btnMicToggle.addEventListener('click', () => {
  if (S.micActive) stopMic();
  else startMic();
});

btnDisappear.addEventListener('click', toggleInvisibility);
btnReset.addEventListener('click', resetStudio);

btnSettingsToggle.addEventListener('click', () => {
  settingsPop.classList.toggle('open');
});

btnDebugMask.addEventListener('click', () => {
  S.showDebug = !S.showDebug;
  btnDebugMask.style.color = S.showDebug ? 'var(--cyan)' : '';
});

btnFullscreen.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

sensRange.addEventListener('input', (e) => {
  S.threshold = parseInt(e.target.value, 10);
  sensText.textContent = S.threshold;
});

modeSelect.addEventListener('change', (e) => {
  S.effectMode = e.target.value;
  updateToast();
});

// Spacebar Hotkey to Trigger Invisibility
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
    e.preventDefault();
    if (S.cameraActive) onClapTrigger();
  }
});

// Auto-initialize on page load
window.addEventListener('load', () => {
  initMediaPipe();
  updateToast();
  startCamera().catch(() => {});
});
</script>
